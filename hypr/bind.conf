###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Friz preferred application bindings
bind = $mainMod, Q, killactive
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, W, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, F, fullscreen, 0


# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more



bind = $mainMod, N, exit,

bind = $mainMod SHIFT, E, exec, $terminal yazi
# bind = $mainMod, SPACE, togglefloating,

bind = $mainMod, O, pseudo, # dwindle
# Disabled: obsolete togglesplit dispatcher: bind = $mainMod, D, togglesplit, # dwindle
bind = $mainMod, X, exec, hyprlock
bind = $mainMod SHIFT,X, exec, wlogout
bind = $mainMod ,T, exec, zsh -c "~/.config/waybar/scripts/theme-switcher.sh next" 
bind = $mainMod SHIFT,T, exec, zsh -c "~/.config/waybar/scripts/theme-switcher.sh list"
bind = $mainMod SHIFT, R, exec, pkill waybar && waybar &
bind = $mainMod , Z, exec, swaync-client --toggle-panel

# Swap (reorder) windows Vim-style
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# Full-screen screenshot: save to file and copy to clipboard
bind = $mainMod, P, exec, sh -c 'file="$HOME/Pictures/screenshot-$(date +%s).png"; grim "$file" && wl-copy < "$file"'

# Region screenshot: open in Swappy; save/copy from Swappy manually
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | swappy -f -

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod,   1, workspace, 1
bind = $mainMod,   2, workspace, 2
bind = $mainMod,   3, workspace, 3
bind = $mainMod,   4, workspace, 4
bind = $mainMod,   5, workspace, 5
bind = $mainMod,   6, workspace, 6

# Move active window
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6


# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindel = SUPER CTRL, equal, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = SUPER CTRL, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = SUPER CTRL, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Microphone
bindl = SUPER CTRL SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Playback
bindl = SUPER CTRL, SPACE, exec, playerctl play-pause
bindl = SUPER CTRL, bracketright, exec, playerctl next
bindl = SUPER CTRL, bracketleft, exec, playerctl previous

# Friz wallpaper bindings

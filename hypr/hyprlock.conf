general {
    hide_cursor = true
    immediate_render = true
    fractional_scaling = 2
    ignore_empty_input = true
    fail_timeout = 1200
}

animations {
    enabled = false
}

background {
    monitor =
    path = /home/friz/Documents/hyprland-dots-original/assets/White_Angel.png

    color = rgba(44, 42, 36, 1.0)
    blur_size = 4
    blur_passes = 2
    noise = 0.02
    contrast = 0.8916
    brightness = 0.52
    vibrancy = 0.17
}

image {
    monitor =
    path = /home/friz/Documents/hyprland-dots-original/assets-profile/bored.jpg
    size = 128
    rounding = -1
    border_size = 4
    border_color = rgba(235, 219, 178, 1.0)

    position = 0, 125
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome, $USER
    color = rgba(235, 219, 178, 1.0)
    font_family = Agave Nerd Font
    font_size = 26

    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(235, 219, 178, 1.0)
    font_family = Agave Nerd Font Mono
    font_size = 72

    position = 0, 34%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%A, %B %d"
    color = rgba(213, 196, 161, 1.0)
    font_family = Agave Nerd Font
    font_size = 22

    position = 0, 25%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 78
    outline_thickness = 4

    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true

    outer_color = rgba(235, 219, 178, 0.95)
    inner_color = rgba(40, 40, 40, 0.88)
    font_color = rgba(235, 219, 178, 1.0)
    check_color = rgba(184, 187, 38, 1.0)
    fail_color = rgba(204, 36, 29, 1.0)

    placeholder_text = <i>Enter password</i>
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    hide_input = false
    rounding = 16

    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(213, 196, 161, 1.0)
    font_family = Agave Nerd Font
    font_size = 15

    position = 0, -155
    halign = center
    valign = center
}
